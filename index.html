<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Lakewood Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column; sticky header, fixed bottom tabs. Machine groups are color-coded like bumper plates. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#E3E8EC; --ink:#16202A; --muted:#566573; --line:#D0D8DE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --ok:#2B8A3E; --danger:#C92A2A;
  --g-chest:#D23A3A; --g-back:#2F6BD0; --g-shoulders:#2E9654; --g-arms:#6F7C89; --g-legs:#C99A08; --g-core:#7C4DDB; --g-cardio:#0E8F8E; --g-func:#8A5A3C;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#18202A; --sunk:#121920; --ink:#E4EAF0; --muted:#97A5B2; --line:#2A3540;
  --accent:#FF7B3D; --accent-ink:#1A0E06; --ok:#5BD072; --danger:#FF6B6B;
  --g-chest:#F05656; --g-back:#5E91F2; --g-shoulders:#4CC27A; --g-arms:#A6B1BC; --g-legs:#F0C232; --g-core:#A381F2; --g-cardio:#2BC4C2; --g-func:#C48A62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#18202A; --sunk:#121920; --ink:#E4EAF0; --muted:#97A5B2; --line:#2A3540;
  --accent:#FF7B3D; --accent-ink:#1A0E06; --ok:#5BD072; --danger:#FF6B6B;
  --g-chest:#F05656; --g-back:#5E91F2; --g-shoulders:#4CC27A; --g-arms:#A6B1BC; --g-legs:#F0C232; --g-core:#A381F2; --g-cardio:#2BC4C2; --g-func:#C48A62;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:26px;text-transform:uppercase}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

main{padding-top:16px}
section+section{margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn.big{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;min-height:54px}
.btn:disabled{opacity:.5;cursor:default}

/* group plate swatch */
.plate{width:12px;height:12px;border-radius:50%;flex:none;background:var(--gc);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--gc) 55%,var(--surface))}
.g-chest{--gc:var(--g-chest)}.g-back{--gc:var(--g-back)}.g-shoulders{--gc:var(--g-shoulders)}.g-arms{--gc:var(--g-arms)}.g-legs{--gc:var(--g-legs)}.g-core{--gc:var(--g-core)}.g-cardio{--gc:var(--g-cardio)}.g-func{--gc:var(--g-func)}

/* today: next up */
.next h2{font-size:40px;text-transform:uppercase}
.next .sub{color:var(--muted);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;font-size:12px;background:var(--sunk)}
.week div b{display:block;font-family:var(--f-display);font-size:17px}
.week .done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week .today{border-color:var(--ink)}
.preview{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.preview li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.preview li .nm{flex:1;min-width:0}
.preview li .tgt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.daypick{display:flex;flex-wrap:wrap;gap:8px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* active workout */
.sessionbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sessionbar h2{font-size:28px;text-transform:uppercase}
.now{border:2px solid var(--gc);border-radius:var(--r);background:var(--surface);overflow:hidden}
.now .band{background:var(--gc);color:#fff;padding:6px 16px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.g-legs .band,.g-arms .band{color:#111}
.now h3{font-size:34px;text-transform:uppercase}
.tip{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.set .n{font-family:var(--f-display);font-size:20px;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 38px 10px 10px;font-family:var(--f-mono);font-size:18px;text-align:right}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:46px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{opacity:.7}
.note input{width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px 10px}
.swaps{display:flex;flex-wrap:wrap;gap:8px}
.swaps button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.queue{list-style:none;margin:0;padding:0}
.queue li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.queue li:first-child button{border-top:0}
.queue li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.queue .nm{flex:1;min-width:0}
.queue .nm small{display:block;color:var(--muted);font-size:12.5px}
.queue .cur{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog.full{color:var(--ok);font-weight:600}
.confirm{border:2px solid var(--accent)}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.rest .in{max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;position:relative;overflow:hidden}
.rest .t{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);border-radius:6px;padding:5px 10px;font-weight:600;font-size:13px}

/* machines */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ghead h2{font-size:24px;text-transform:uppercase}
.ghead .rule{flex:1;height:4px;border-radius:2px;background:var(--gc);opacity:.85}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mlist li:first-child{border-top:0}
.mlist li.off .mn{opacity:.5;text-decoration:line-through}
.mn{font-weight:600}
.mn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.mstat{display:flex;align-items:center;gap:8px;justify-self:end}
.mlist .note{grid-column:1/-1}
.toggle{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:var(--ok);color:var(--ok)}
.spark{width:72px;height:24px;color:var(--gc);display:block}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.add input,form.add select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0}
form.add input{grid-column:1/-1}
form.add button{grid-column:1/-1}

/* plan */
.prose{max-width:62ch}
.prose p{margin:0 0 10px}
.phases{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.phases div{border-radius:6px;padding:8px 0 6px;text-align:center;background:var(--sunk);font-size:11px;border:1px solid var(--line)}
.phases div b{display:block;font-family:var(--f-display);font-size:18px}
.phases .is{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.phases .dl{background:transparent;border-style:dashed}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable td{padding:8px 0;border-top:1px solid var(--line);vertical-align:middle}
.ptable td:last-child{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;padding-left:10px}
.ptable .row{gap:8px}
.daycard h3{font-size:24px;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rules{margin:0;padding-left:18px}
.rules li{margin-bottom:6px}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stats b{display:block;font-family:var(--f-display);font-size:32px;line-height:1}
.hist{list-style:none;margin:0;padding:0}
.hist>li{border-top:1px solid var(--line)}
.hist>li:first-child{border-top:0}
.hist .head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px}
.hist .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hist .date{font-family:var(--f-display);font-size:20px;width:52px;text-align:center;line-height:1}
.hist .date small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hist .detail{padding:0 14px 14px}
.hist .detail table{width:100%;border-collapse:collapse;font-size:13.5px}
.hist .detail td{padding:6px 0;border-top:1px solid var(--line)}
.hist .detail td:last-child{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-family:var(--f-display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:relative;min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:min(92vw,420px);text-align:center}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted)}
@media (max-width:380px){.next h2{font-size:34px}.now h3{font-size:28px}.set{grid-template-columns:28px 1fr 1fr 48px;gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Lakewood Lift Log</h1><p>Crunch Lakewood · 5815 Bellflower Blvd</p></div>
  <span class="chip" id="phasechip"><span class="dot"></span><span>Week 1</span></span>
</div></header>
<main class="wrap" id="main"><section class="card pad"><p class="muted">Loading your log…</p></section></main>
<div class="rest" id="rest" hidden><div class="in"><div><div class="label" style="color:inherit;opacity:.7">Rest</div><div class="t" id="restT">1:30</div></div><span style="flex:1"></span><button type="button" data-act="rest-add">+30 s</button><button type="button" data-act="rest-skip">Skip</button><div class="bar" id="restBar"></div></div></div>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-act="tab" data-v="today">Today</button>
  <button type="button" data-act="tab" data-v="machines">Machines</button>
  <button type="button" data-act="tab" data-v="plan">Plan</button>
  <button type="button" data-act="tab" data-v="history">History</button>
</div></nav>

const KINDS=['Selectorized','Plate-loaded','Cable','Free weight','Bodyweight','Cardio'];

// day key -> [machine, sets, repLow, repHigh]   (cardio: sets=1, reps = minutes)
const DAYS={
  A:{name:'Upper A',sub:'Chest, back, shoulders, arms',items:[['chest-press',3,8,12],['lat-pulldown',3,8,12],['shoulder-press',3,8,12],['seated-row',3,10,12],['pec-fly',2,12,15],['triceps-pushdown',2,12,15],['biceps-curl',2,12,15],['elliptical',1,10,10]]},

  D:{name:'Lower B',sub:'Glutes, hamstrings, core',items:[['hack-squat',3,8,10],['glute-drive',3,8,12],['lying-curl',3,10,12],['hip-add',2,12,15],['back-ext',3,10,15],['captain',3,8,12],['treadmill',1,15,15]]},
};
const ORDER=['A','B','C','D'];
const SCHEDULE=[['Mon','A'],['Tue','B'],['Wed',null],['Thu','C'],['Fri',null],['Sat','D'],['Sun',null]];
const PHASES={1:['Calibrate','Find your working weights. End every set with about 2 reps left in the tank.'],
  2:['Build','Use the suggested weight. Add a rep where you can.'],3:['Build','Use the suggested weight. Add a rep where you can.'],
  4:['Deload','One fewer set on every machine, same weights. Let your joints catch up.'],
  5:['Build','Push the top of each rep range, then add weight.'],6:['Build','Push the top of each rep range, then add weight.'],7:['Build','Push the top of each rep range, then add weight.'],
  8:['Test','Last set on each machine: go to one rep short of failure. Next week starts cycle 2.']};
const HOURS={1:'5:00 am – midnight',2:'Open 24 hours',3:'Open 24 hours',4:'Open 24 hours',5:'Midnight – 9:00 pm',6:'7:00 am – 7:00 pm',0:'7:00 am – 7:00 pm'};
const HEAVY=['leg-press','hack-squat','glute-drive','sled','squat-rack','smith'];

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function relDays(iso){const n=Math.round((dayStart(Date.now())-dayStart(iso))/864e5);return n<=0?'today':n===1?'yesterday':n+' days ago'}
function fmtDate(iso,o){return new Date(iso).toLocaleDateString(undefined,o)}

/* ---------- state ---------- */
const defaultProfile=()=>({machines:{},custom:[],startDate:null,active:null,activeRev:0});
const S={tab:'today',profile:defaultProfile(),sessions:[],mode:'local',gfilter:'all',open:null,ask:null,rest:null,pick:null,swap:false};
const machines=()=>BASE.concat((S.profile.custom||[]).map(c=>({...c,alts:[],cue:'',custom:true})));
const mach=id=>machines().find(m=>m.id===id)||{id,name:id,group:'func',kind:'Free weight',alts:[],cue:''};
const isHere=id=>!(S.profile.machines&&S.profile.machines[id]&&S.profile.machines[id].off);
const noteOf=id=>(S.profile.machines&&S.profile.machines[id]&&S.profile.machines[id].note)||'';
const byDate=(a,b)=>String(b.date).localeCompare(String(a.date));
const incFor=id=>HEAVY.includes(id)?10:5;

function weekInfo(){
  if(!S.profile.startDate) return {week:1,cycle:1};
  const d=Math.max(0,Math.floor((dayStart(Date.now())-dayStart(S.profile.startDate))/864e5));
  return {week:Math.floor(d/7)%8+1,cycle:Math.floor(d/56)+1};
}
const setsFor=n=>weekInfo().week===4&&n>1?n-1:n;
function nextDay(){const last=S.sessions[0];if(!last)return 'A';return ORDER[(ORDER.indexOf(last.day)+1)%ORDER.length]||'A'}

function lastEntry(mid){
  for(const s of S.sessions){const e=(s.entries||[]).find(e=>e.m===mid&&(e.rows||[]).some(r=>r.done));if(e)return {s,e}}
  return null;
}
function suggest(mid,lo,hi,n){
  const m=mach(mid),cardio=m.kind==='Cardio',bw=m.kind==='Bodyweight',assist=mid==='assist-pullup';
  const last=lastEntry(mid);
  if(!last) return {w:'',text:cardio?`First time: ${lo} min at a level you can talk through. Log the level.`:bw?`First time: aim for ${hi} reps per set.`:`First time: pick a weight you could lift about ${hi+2} times. Log it and adjust.`};
  const done=last.e.rows.filter(r=>r.done);
  const ws=done.map(r=>+r.w||0),reps=done.map(r=>+r.r||0);
  const top=assist?Math.min(...ws):Math.max(...ws);
  const allTop=done.length>=n&&reps.every(r=>r>=hi);
  const ago=relDays(last.s.date);
  if(cardio) return allTop?{w:top+1,text:`Last ${ago}: level ${top} for ${reps[0]} min. Go up to level ${top+1}.`}:{w:top,text:`Last ${ago}: level ${top}, ${reps[0]} min. Same level, finish ${hi} min.`};
  if(bw) return {w:ws.some(Boolean)?top:'',text:`Last ${ago}: ${reps.join(' / ')} reps. Beat at least one of those.`};
  if(allTop){const nw=assist?Math.max(0,top-incFor(mid)):top+incFor(mid);return {w:nw,text:`Last ${ago}: ${top} lb × ${reps.join('/')}. You hit ${hi} on every set, so ${assist?'drop the assist to':'go up to'} ${nw} lb.`}}
  return {w:top,text:`Last ${ago}: ${top} lb × ${reps.join('/')}. Stay at ${top} lb and add a rep where you can.`};
}
const makeRows=(mid,n,lo,hi)=>{const w=suggest(mid,lo,hi,n).w;return Array.from({length:n},()=>({w:w===''?'':String(w),r:'',done:false}))};

/* ---------- persistence: account (db capability) or this device ---------- */
const LS='lakewood-lift-log.v1';
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.profile={...defaultProfile(),...d.profile};S.sessions=(d.sessions||[]).sort(byDate)}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,sessions:S.sessions}))}catch(e){}}
let R=null,chain=Promise.resolve();
function queue(fn){chain=chain.then(fn).catch(e=>{toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old workouts in History to keep saving.':'Couldn\'t reach your account. Changes are kept on this device.')});return chain}
function saveProfile(){lsSave();if(R){const body=clone(S.profile);queue(()=>R.p.set(body))}}
function saveActive(){S.profile.activeRev=(S.profile.activeRev||0)+1;saveProfile()}
function putSession(s){S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)].sort(byDate);lsSave();if(R){const b=clone(s);queue(()=>R.c.doc(s.id).set(b))}}
function dropSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);lsSave();if(R)queue(()=>R.c.doc(id).delete())}
function adoptProfile(p){
  const local=S.profile,keep=(local.activeRev||0)>=(p.activeRev||0);
  S.profile={...defaultProfile(),...clone(p)};
  if(keep){S.profile.active=local.active;S.profile.activeRev=local.activeRev}
}
async function connect(){
  const c=window.claude;if(!c||typeof c.use!=='function')return;
  let db,user;try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){return}
  if(!db||!user)return;
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid)return;
  const p=db.doc('data/users/'+uid+'/profile'),col=p.collection('sessions');
  let ps,cs;try{[ps,cs]=await Promise.all([p.get(),col.get()])}catch(e){return}
  R={p,c:col};S.mode='account';
  if(!ps.exists&&cs.empty){
    const hasLocal=S.sessions.length||S.profile.startDate||S.profile.custom.length||Object.keys(S.profile.machines).length;
    if(hasLocal){ // one-time move of this device's log into the account
      try{await p.set(clone(S.profile));for(const s of S.sessions)await col.doc(s.id).set(clone(s))}
      catch(e){R=null;S.mode='local';toast('Couldn\'t copy your log to your account. It stays on this device.')}
    }
  }else{
    if(ps.exists)adoptProfile(ps.data());
    S.sessions=cs.docs.map(d=>clone(d.data())).sort(byDate);lsSave();
  }
  softRender();
  if(!R)return;
  p.onSnapshot(d=>{if(d.metadata.hasPendingWrites||!d.exists)return;adoptProfile(d.data());lsSave();softRender()},()=>{});
  col.onSnapshot(q=>{if(q.metadata.hasPendingWrites)return;S.sessions=q.docs.map(d=>clone(d.data())).sort(byDate);lsSave();softRender()},()=>{});
}

}

  </section>

  <p class="foot">${S.mode==='account'?'Saved to your Claude account. Works on any device you sign in on.':'Saved on this device.'}</p>`;

function vActive(a){

function topWeights(mid){
  return S.sessions.slice().reverse().map(s=>(s.entries||[]).find(e=>e.m===mid)).filter(Boolean)
    .map(e=>{const ws=e.rows.filter(r=>r.done).map(r=>+r.w||0);return mid==='assist-pullup'?Math.min(...ws):Math.max(...ws)}).filter(n=>isFinite(n));
}
function spark(vals){
  if(vals.length<2)return '';
  const v=vals.slice(-12),lo=Math.min(...v),hi=Math.max(...v),W=72,H=24,p=3;
  const x=i=>p+i*(W-2*p)/(v.length-1),y=n=>hi===lo?H/2:H-p-(n-lo)*(H-2*p)/(hi-lo);
  const pts=v.map((n,i)=>`${x(i).toFixed(1)},${y(n).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${x(v.length-1).toFixed(1)}" cy="${y(v[v.length-1]).toFixed(1)}" r="2.6" fill="currentColor"/></svg>`;
}

function vPlan(){
  const {week,cycle}=weekInfo();
  return `
  <section class="card pad">
    <span class="label">Your program</span>
    <h2 style="font-size:32px;text-transform:uppercase;margin-top:4px">8-week upper / lower</h2>
    <div class="prose" style="margin-top:10px"><p>Four machine-based days a week, each body part twice. Every session ends with 10–15 minutes of cardio. Each workout runs about an hour.</p></div>
    <div class="phases" aria-label="Cycle weeks">${[1,2,3,4,5,6,7,8].map(w=>`<div class="${w===week?'is':''} ${w===4?'dl':''}"><b>${w}</b>${PHASES[w][0]}</div>`).join('')}</div>
    <p class="muted" style="margin:10px 0 0;font-size:13.5px">You're in cycle ${cycle}, week ${week}: ${esc(PHASES[week][1])}${S.profile.startDate?'':' The clock starts with your first workout.'}</p>
  </section>
  <section>
    <div class="ghead"><h2>Weekly schedule</h2><span class="rule" style="background:var(--line)"></span></div>
    <div class="card pad"><table class="ptable"><tbody>${SCHEDULE.map(([d,k])=>`<tr><td><b>${d}</b></td><td>${k?esc(DAYS[k].name)+' <span class="muted">· '+esc(DAYS[k].sub)+'</span>':'<span class="muted">Rest, or a walk / class</span>'}</td><td></td></tr>`).join('')}</tbody></table>
    <p class="muted" style="margin:10px 0 0;font-size:13.5px">Miss a day? Don't skip ahead. The app always queues the next workout in order: Upper A → Lower A → Upper B → Lower B.</p></div>
  </section>
  <section class="days">${ORDER.map(k=>{const d=DAYS[k];return `<div class="card pad daycard"><h3>${esc(d.name)}</h3><div class="muted" style="font-size:13px;margin-bottom:6px">${esc(d.sub)}</div><table class="ptable"><tbody>${d.items.map(([m,n,lo,hi])=>{const mm=mach(m);return `<tr><td><span class="row">${plate(mm.group)}${esc(mm.name)}</span></td><td>${target(n,lo,hi,mm)}</td></tr>`}).join('')}</tbody></table></div>`}).join('')}</section>
  <section class="card pad prose">
    <h2 style="font-size:22px;text-transform:uppercase;margin-bottom:8px">How to progress</h2>
    <ul class="rules">
      <li><b>Rep ranges.</b> When you hit the top of the range on every set, the app adds 5 lb next time (10 lb on leg press, hack squat, glute drive, Smith). Otherwise it keeps the weight and you chase one more rep.</li>
      <li><b>Effort.</b> Finish most sets with 1–2 good reps left. Form breaks down? That set is over.</li>
      <li><b>Rest.</b> About 90 seconds between sets. The timer starts when you check off a set.</li>
      <li><b>Tempo.</b> Lift in about 1 second, lower in 2–3. Pause briefly at the squeeze.</li>
      <li><b>Machine taken?</b> Tap "Machine taken?" to swap to an alternate in the same group, or jump to another machine in the list and come back.</li>
      <li><b>Warm up.</b> 5 minutes easy cardio, then one light set of 10–12 on the first machine. Don't log warm-ups.</li>
    </ul>
  </section>
  <section class="card pad">
    <h2 style="font-size:22px;text-transform:uppercase;margin-bottom:8px">Club hours</h2>
    <div class="hours"><b>Mon</b><span>5:00 am – midnight</span><b>Tue–Thu</b><span>Open 24 hours</span><b>Fri</b><span>Until 9:00 pm</span><b>Sat–Sun</b><span>7:00 am – 7:00 pm</span></div>
    <p class="muted" style="margin:10px 0 0;font-size:13px">From crunch.com/locations/lakewood. Holiday hours vary. Club phone 562-262-0404.</p>
  </section>`;
}

function vHistory(){
  const now=new Date(),mon=dayStart(now);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const m1=new Date(now.getFullYear(),now.getMonth(),1);
  const wk=S.sessions.filter(s=>new Date(s.date)>=mon).length;
  const setsMo=S.sessions.filter(s=>new Date(s.date)>=m1).reduce((t,s)=>t+s.entries.reduce((u,e)=>u+e.rows.length,0),0);
  if(!S.sessions.length) return `<section class="card empty"><h2 style="font-size:26px;text-transform:uppercase;color:var(--ink)">No workouts yet</h2><p>Finished workouts land here with every set you logged. Start your first one from Today.</p><button type="button" class="btn primary" data-act="tab" data-v="today">Go to Today</button></section>`;
  return `
  <section class="stats"><div><b class="num">${wk}</b><span class="label">This week</span></div><div><b class="num">${setsMo}</b><span class="label">Sets this month</span></div><div><b class="num">${S.sessions.length}</b><span class="label">All workouts</span></div></section>
  <section class="card"><ul class="hist">${S.sessions.map(s=>{const open=S.open===s.id,sets=s.entries.reduce((t,e)=>t+e.rows.length,0),vol=s.entries.reduce((t,e)=>mach(e.m).kind==='Cardio'?t:t+e.rows.reduce((u,r)=>u+(+r.w||0)*(+r.r||0),0),0);return `
    <li><button type="button" class="head" data-act="open" data-v="${esc(s.id)}" aria-expanded="${open}">
      <span class="date">${fmtDate(s.date,{day:'numeric'})}<small>${fmtDate(s.date,{month:'short'})}</small></span>
      <span style="flex:1;min-width:0"><b>${esc(DAYS[s.day]?.name||'Workout')}</b><span class="muted" style="display:block;font-size:13px">${s.durationMin} min · ${sets} sets · <span class="num">${vol.toLocaleString()}</span> lb moved</span></span>
      <span class="muted" aria-hidden="true">${open?'−':'+'}</span></button>
      ${open?`<div class="detail"><table><tbody>${s.entries.map(e=>{const mm=mach(e.m),c=mm.kind==='Cardio';return `<tr><td><span class="row">${plate(mm.group)}${esc(mm.name)}</span></td><td>${e.rows.map(r=>c?`L${esc(r.w)} · ${esc(r.r)} min`:`${esc(r.w||'BW')}×${esc(r.r)}`).join(', ')}</td></tr>`}).join('')}</tbody></table>
        <div class="row" style="margin-top:10px;justify-content:flex-end">${S.ask==='del:'+s.id?`<span class="muted" style="font-size:13px">Delete for good?</span><button type="button" class="btn" data-act="ask-cancel">Cancel</button><button type="button" class="btn danger" data-act="del" data-v="${esc(s.id)}">Delete</button>`:`<button type="button" class="btn ghost" data-act="del-ask" data-v="${esc(s.id)}">Delete workout</button>`}</div></div>`:''}
    </li>`}).join('')}</ul></section>`;
}

/* ---------- actions ---------- */
function startWorkout(key){
  const items=DAYS[key].items.map(([m,n,lo,hi])=>{let id=m;if(!isHere(id)){const alt=mach(m).alts.find(isHere);if(alt)id=alt}const k=setsFor(n);return {plan:m,m:id,lo,hi,rows:makeRows(id,k,lo,hi)}});
  if(!S.profile.startDate)S.profile.startDate=dayStart(Date.now()).toISOString();
  S.profile.active={id:newId(),day:key,started:new Date().toISOString(),cur:0,items};
  S.pick=null;S.swap=false;saveActive();render();window.scrollTo(0,0);
}
function goNext(){
  const a=S.profile.active,n=a.items.length;
  for(let k=1;k<=n;k++){const i=(a.cur+k)%n;if(a.items[i].rows.some(r=>!r.done)){a.cur=i;return true}}
  return false;
}
function finish(save){
  const a=S.profile.active;
  if(save){
    const entries=a.items.map(it=>({m:it.m,plan:it.plan,lo:it.lo,hi:it.hi,rows:it.rows.filter(r=>r.done).map(r=>({w:r.w,r:r.r,done:true}))})).filter(e=>e.rows.length);
    putSession({id:a.id,day:a.day,date:new Date().toISOString(),started:a.started,durationMin:Math.max(1,Math.round((Date.now()-new Date(a.started))/6e4)),entries});
  }
  S.profile.active=null;S.ask=null;stopRest();saveActive();
  S.tab=save?'history':'today';S.open=save?a.id:null;render();window.scrollTo(0,0);
  if(save)toast('Workout saved');
}
function startRest(){S.rest={end:Date.now()+REST_S*1000,total:REST_S};tickClock()}
function stopRest(){S.rest=null;document.getElementById('rest').hidden=true}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,a=S.profile.active;
  switch(act){
    case 'tab':S.tab=v;S.ask=null;render();window.scrollTo(0,0);break;
    case 'pick':S.pick=v;render();break;
    case 'start':startWorkout(v);break;
    case 'cur':a.cur=+v;S.swap=false;saveActive();render();break;
    case 'tick':{const it=a.items[a.cur],r=it.rows[+v];
      if(!r.done&&!String(r.r).trim()){toast(mach(it.m).kind==='Cardio'?'Enter the minutes first.':'Enter your reps first.');const el=document.getElementById(`r-${a.cur}-${v}`);if(el)el.focus();break}
      r.done=!r.done;
      if(r.done&&+v<it.rows.length-1&&!it.rows[+v+1].done&&!it.rows[+v+1].w)it.rows[+v+1].w=r.w;
      if(r.done){if(it.rows.every(x=>x.done)){const moved=goNext();S.swap=false;stopRest();if(moved){startRest();toast('Next: '+mach(a.items[a.cur].m).name)}else{toast('Every set done. Tap Finish to save.')}}else if(mach(it.m).kind!=='Cardio')startRest()}
      saveActive();render();break}
    case 'add-set':{const it=a.items[a.cur],l=it.rows[it.rows.length-1];it.rows.push({w:l?l.w:'',r:'',done:false});saveActive();render();break}
    case 'rm-set':{const it=a.items[a.cur];if(it.rows.length>1&&!it.rows[it.rows.length-1].done)it.rows.pop();saveActive();render();break}
    case 'swap-toggle':S.swap=!S.swap;render();break;
    case 'swap':{const it=a.items[a.cur];it.m=v;if(!it.rows.some(r=>r.done))it.rows=makeRows(v,it.rows.length,it.lo,it.hi);S.swap=false;saveActive();render();break}
    case 'next':if(!goNext())toast('Every set done. Tap Finish to save.');S.swap=false;saveActive();render();window.scrollTo(0,0);break;
    case 'finish-ask':S.ask='finish';render();window.scrollTo(0,0);break;
    case 'finish-save':finish(true);break;
    case 'finish-discard':finish(false);break;
    case 'ask-cancel':S.ask=null;render();break;
    case 'rest-skip':stopRest();break;
    case 'rest-add':if(S.rest){S.rest.end+=30000;S.rest.total+=30}tickClock();break;
    case 'here':{const cur=S.profile.machines[v]||{};S.profile.machines[v]={...cur,off:isHere(v)};saveProfile();render();break}
    case 'del-custom':S.profile.custom=S.profile.custom.filter(c=>c.id!==v);saveProfile();render();break;
    case 'gf':S.gfilter=v;render();break;
    case 'open':S.open=S.open===v?null:v;S.ask=null;render();break;
    case 'del-ask':S.ask='del:'+v;render();break;
    case 'del':dropSession(v);S.ask=null;S.open=null;render();toast('Workout deleted');break;
  }
});
main.addEventListener('input',e=>{
  const t=e.target,a=S.profile.active;
  if(t.dataset.f&&a){a.items[a.cur].rows[+t.dataset.j][t.dataset.f]=t.value.trim();lsSave()}
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&S.profile.active)saveActive();
  if(t.dataset.note){const id=t.dataset.note,cur=S.profile.machines[id]||{};S.profile.machines[id]={...cur,note:t.value.trim().slice(0,80)};saveProfile()}
});
main.addEventListener('submit',e=>{
  if(e.target.id!=='addform')return;e.preventDefault();
  const f=new FormData(e.target),name=String(f.get('name')||'').trim().slice(0,60);if(!name)return;
  S.profile.custom=[...(S.profile.custom||[]),{id:'c-'+newId(),name,group:String(f.get('group')),kind:String(f.get('kind'))}];
  S.gfilter=String(f.get('group'));saveProfile();render();toast('Added '+name);
});

/* ---------- clocks & toast ---------- */
function tickClock(){
  const a=S.profile.active,el=document.getElementById('elapsed');
  if(a&&el){const s=Math.floor((Date.now()-new Date(a.started))/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
  const box=document.getElementById('rest');
  if(S.rest){
    const left=Math.max(0,Math.ceil((S.rest.end-Date.now())/1000));
    box.hidden=false;
    document.getElementById('restT').textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Go!';
    document.getElementById('restBar').style.width=(100*(1-left/S.rest.total))+'%';
    if(!left&&!S.rest.buzzed){S.rest.buzzed=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(S.rest&&S.rest.buzzed)stopRest()},4000)}
  }else box.hidden=true;
}
setInterval(tickClock,500);
let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

/* ---------- boot ---------- */
lsLoad();render();connect();
})();
</script>

</body></html>
